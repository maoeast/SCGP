<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">SCGP 核心训练闭环</title>
  <desc id="desc">围绕学生档案建立目标，安排游戏、器材、情绪和自理训练，记录表现，形成报告，再调整下一周期计划。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4b6570"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17323d" flood-opacity="0.11"/></filter>
    <style>
      .title{font:700 34px 'Microsoft YaHei',Arial,sans-serif;fill:#17323d}.subtitle{font:400 17px 'Microsoft YaHei',Arial,sans-serif;fill:#60737c}
      .label{font:700 20px 'Microsoft YaHei',Arial,sans-serif;fill:#17323d}.body{font:400 15px 'Microsoft YaHei',Arial,sans-serif;fill:#425963}.small{font:400 13px 'Microsoft YaHei',Arial,sans-serif;fill:#60737c}
      .box{stroke:#d5e0e3;stroke-width:1.5;filter:url(#shadow)}.arrow{stroke:#4b6570;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f7faf9"/>
  <text x="60" y="62" class="title">SCGP 核心训练闭环</text>
  <text x="60" y="94" class="subtitle">同一学生的评估、计划、训练、记录和报告互相衔接</text>

  <rect x="455" y="150" width="290" height="105" rx="8" fill="#fff4d6" class="box"/>
  <text x="600" y="192" text-anchor="middle" class="label">1. 学生与能力基线</text>
  <text x="600" y="222" text-anchor="middle" class="body">档案、观察与适用评估</text>

  <rect x="820" y="245" width="290" height="105" rx="8" fill="#e9f2fb" class="box"/>
  <text x="965" y="287" text-anchor="middle" class="label">2. 目标与计划草稿</text>
  <text x="965" y="317" text-anchor="middle" class="body">长期/短期目标、日期、资源</text>

  <rect x="820" y="445" width="290" height="125" rx="8" fill="#e8f5f1" class="box"/>
  <text x="965" y="485" text-anchor="middle" class="label">3. 执行训练</text>
  <text x="965" y="516" text-anchor="middle" class="body">游戏 / 器材 / 情绪情境 / 自理</text>
  <text x="965" y="543" text-anchor="middle" class="small">先核对授权、资源、设备和安全</text>

  <rect x="455" y="540" width="290" height="105" rx="8" fill="#f0ecf8" class="box"/>
  <text x="600" y="582" text-anchor="middle" class="label">4. 保存训练记录</text>
  <text x="600" y="612" text-anchor="middle" class="body">完成状态、时长、评分和提示层级</text>

  <rect x="90" y="445" width="290" height="125" rx="8" fill="#fbe9e5" class="box"/>
  <text x="235" y="485" text-anchor="middle" class="label">5. 查看报告与趋势</text>
  <text x="235" y="516" text-anchor="middle" class="body">维度结果、训练表现、IEP 评语</text>
  <text x="235" y="543" text-anchor="middle" class="small">保留解释、适用范围与免责声明</text>

  <rect x="90" y="245" width="290" height="105" rx="8" fill="#eef2e8" class="box"/>
  <text x="235" y="287" text-anchor="middle" class="label">6. 复盘与调整</text>
  <text x="235" y="317" text-anchor="middle" class="body">比较阶段变化，调整目标和资源</text>

  <path d="M745 202 C810 202 842 230 866 258" class="arrow"/>
  <path d="M1010 350 V445" class="arrow"/>
  <path d="M820 525 C780 555 760 570 745 585" class="arrow"/>
  <path d="M455 592 H380" class="arrow"/>
  <path d="M190 445 C170 405 170 382 195 350" class="arrow"/>
  <path d="M380 285 C420 232 445 215 455 210" class="arrow"/>

  <circle cx="600" cy="380" r="102" fill="#ffffff" stroke="#cfdcdf" stroke-width="2"/>
  <text x="600" y="363" text-anchor="middle" class="label">教师专业判断</text>
  <text x="600" y="394" text-anchor="middle" class="body">学生意愿 · 现场安全</text>
  <text x="600" y="421" text-anchor="middle" class="body">客观记录 · 家校协作</text>
</svg>
