<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">评估到训练计划流程</title>
  <desc id="desc">从选择量表和学生开始，经过说明确认、逐项作答、进度恢复、完成报告、推荐筛选，最终生成并复核训练计划草稿。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#49626d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17323d" flood-opacity="0.11"/></filter>
    <style>
      .title{font:700 34px 'Microsoft YaHei',Arial,sans-serif;fill:#17323d}.subtitle{font:400 17px 'Microsoft YaHei',Arial,sans-serif;fill:#60737c}
      .step{font:700 16px Arial,sans-serif;fill:#fff}.label{font:700 20px 'Microsoft YaHei',Arial,sans-serif;fill:#17323d}.body{font:400 15px 'Microsoft YaHei',Arial,sans-serif;fill:#425963}.small{font:400 13px 'Microsoft YaHei',Arial,sans-serif;fill:#60737c}
      .box{stroke:#d5e0e3;stroke-width:1.5;filter:url(#shadow)}.arrow{stroke:#49626d;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f7faf9"/>
  <text x="60" y="62" class="title">评估到训练计划流程</text>
  <text x="60" y="94" class="subtitle">评估结果先形成报告和推荐，再由教师复核为可执行计划</text>

  <rect x="70" y="150" width="300" height="150" rx="8" fill="#e9f2fb" class="box"/>
  <circle cx="105" cy="185" r="18" fill="#2f78a8"/><text x="105" y="191" text-anchor="middle" class="step">1</text>
  <text x="135" y="192" class="label">选择分类、量表与学生</text>
  <text x="95" y="232" class="body">核对能力包、年龄范围和作答者</text>
  <text x="95" y="259" class="small">本人任务、教师问卷和家长问卷不可混用</text>

  <rect x="450" y="150" width="300" height="150" rx="8" fill="#fff4d6" class="box"/>
  <circle cx="485" cy="185" r="18" fill="#b88619"/><text x="485" y="191" text-anchor="middle" class="step">2</text>
  <text x="515" y="192" class="label">阅读说明并开始</text>
  <text x="475" y="232" class="body">确认适用范围、操作要求和限制</text>
  <text x="475" y="259" class="small">准备环境、材料和足够时间</text>

  <rect x="830" y="150" width="300" height="150" rx="8" fill="#e8f5f1" class="box"/>
  <circle cx="865" cy="185" r="18" fill="#2f8d75"/><text x="865" y="191" text-anchor="middle" class="step">3</text>
  <text x="895" y="192" class="label">逐项作答与保存进度</text>
  <text x="855" y="232" class="body">上一题 / 下一题复核，观察完成进度</text>
  <text x="855" y="259" class="small">再次进入可继续或放弃未完成进度</text>

  <path d="M370 225 H450" class="arrow"/>
  <path d="M750 225 H830" class="arrow"/>
  <path d="M980 300 V365" class="arrow"/>

  <rect x="830" y="390" width="300" height="150" rx="8" fill="#f0ecf8" class="box"/>
  <circle cx="865" cy="425" r="18" fill="#7656a3"/><text x="865" y="431" text-anchor="middle" class="step">4</text>
  <text x="895" y="432" class="label">完成并查看报告</text>
  <text x="855" y="472" class="body">核对维度结果、图表和免责声明</text>
  <text x="855" y="499" class="small">DRAFT / 筛查类结果不得写成诊断</text>

  <rect x="450" y="390" width="300" height="150" rx="8" fill="#fbe9e5" class="box"/>
  <circle cx="485" cy="425" r="18" fill="#b6604c"/><text x="485" y="431" text-anchor="middle" class="step">5</text>
  <text x="515" y="432" class="label">筛选推荐资源</text>
  <text x="475" y="472" class="body">查看薄弱或巩固方向，选择授权资源</text>
  <text x="475" y="499" class="small">结合学生状态、器材和专业建议复核</text>

  <rect x="70" y="390" width="300" height="150" rx="8" fill="#eef2e8" class="box"/>
  <circle cx="105" cy="425" r="18" fill="#6f8251"/><text x="105" y="431" text-anchor="middle" class="step">6</text>
  <text x="135" y="432" class="label">生成并启用计划</text>
  <text x="95" y="472" class="body">先生成草稿，再核对目标、日期和资源</text>
  <text x="95" y="499" class="small">教师确认后启用，执行记录进入后续复盘</text>

  <path d="M830 465 H750" class="arrow"/>
  <path d="M450 465 H370" class="arrow"/>

  <rect x="210" y="600" width="780" height="58" rx="8" fill="#ffffff" stroke="#d5e0e3"/>
  <text x="600" y="624" text-anchor="middle" class="label">关键边界</text>
  <text x="600" y="649" text-anchor="middle" class="body">评估报告不是处方；推荐不是自动生效；计划草稿必须由教师复核</text>
</svg>
